<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test AI Chat - Shoe Store</title>
    <meta name="csrf-token" content="test-token">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .test-container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            max-width: 800px;
            margin: 0 auto;
        }
        .status-item {
            display: flex;
            align-items: center;
            padding: 10px;
            margin: 5px 0;
            border-radius: 8px;
            background: #f8f9fa;
        }
        .status-item.success {
            background: #d4edda;
            border-left: 4px solid #28a745;
        }
        .status-item.error {
            background: #f8d7da;
            border-left: 4px solid #dc3545;
        }
        .test-section {
            margin-bottom: 30px;
        }
        .chat-demo {
            border: 2px dashed #ddd;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <div class="text-center mb-4">
            <h1>🤖 AI Chat System Test</h1>
            <p class="lead">Kiểm tra hệ thống chat AI của Shoe Store</p>
        </div>

        <div class="test-section">
            <h3>📋 System Status</h3>
            <div id="system-status">
                <div class="status-item">
                    <i class="fas fa-spinner fa-spin me-2"></i>
                    Đang kiểm tra hệ thống...
                </div>
            </div>
        </div>

        <div class="test-section">
            <h3>🧪 API Tests</h3>
            <button id="test-suggestions" class="btn btn-primary me-2">Test Suggestions API</button>
            <button id="test-context" class="btn btn-secondary me-2">Test Context API</button>
            <button id="test-message" class="btn btn-success">Test Message API</button>
            <div id="api-results" class="mt-3"></div>
        </div>

        <div class="test-section">
            <h3>💬 Chat Widget Demo</h3>
            <div class="chat-demo">
                <p>Chat bubble sẽ xuất hiện ở góc phải màn hình</p>
                <button id="open-chat" class="btn btn-primary">
                    <i class="fas fa-comments"></i> Mở Chat
                </button>
                <button id="send-test-message" class="btn btn-outline-primary ms-2">
                    <i class="fas fa-paper-plane"></i> Gửi tin nhắn test
                </button>
            </div>
        </div>

        <div class="test-section">
            <h3>🔧 Debug Information</h3>
            <div class="row">
                <div class="col-md-6">
                    <h6>JavaScript Objects:</h6>
                    <ul id="js-objects" class="list-unstyled">
                        <li>Checking...</li>
                    </ul>
                </div>
                <div class="col-md-6">
                    <h6>Console Logs:</h6>
                    <div id="console-logs" style="height: 150px; overflow-y: auto; background: #f8f9fa; padding: 10px; border-radius: 5px;">
                        <small>Console logs will appear here...</small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Load Chat Scripts -->
    <script src="/js/ai-chat.js"></script>
    <script src="/js/product-chat-integration.js"></script>

    <script>
        // Override console.log to capture logs
        const originalLog = console.log;
        const originalError = console.error;
        
        function addToConsoleLog(type, message) {
            const logs = document.getElementById('console-logs');
            logs.innerHTML += `<div class="text-${type === 'error' ? 'danger' : 'info'}">[${new Date().toLocaleTimeString()}] ${message}</div>`;
            logs.scrollTop = logs.scrollHeight;
        }
        
        console.log = function(...args) {
            originalLog.apply(console, args);
            addToConsoleLog('log', args.join(' '));
        };
        
        console.error = function(...args) {
            originalError.apply(console, args);
            addToConsoleLog('error', args.join(' '));
        };

        // Test functions
        function checkSystemStatus() {
            const statusContainer = document.getElementById('system-status');
            statusContainer.innerHTML = '';
            
            const checks = [
                {
                    name: 'jQuery loaded',
                    test: () => typeof $ !== 'undefined',
                },
                {
                    name: 'AI Chat script loaded',
                    test: () => typeof window.aiChat !== 'undefined',
                },
                {
                    name: 'Chat widget HTML present',
                    test: () => document.getElementById('ai-chat-widget') !== null,
                },
                {
                    name: 'Global functions available',
                    test: () => typeof window.openAIChat === 'function',
                }
            ];
            
            checks.forEach(check => {
                const result = check.test();
                const div = document.createElement('div');
                div.className = `status-item ${result ? 'success' : 'error'}`;
                div.innerHTML = `
                    <i class="fas fa-${result ? 'check' : 'times'} me-2"></i>
                    ${check.name}: ${result ? 'OK' : 'FAILED'}
                `;
                statusContainer.appendChild(div);
            });
        }
        
        function checkJSObjects() {
            const container = document.getElementById('js-objects');
            const objects = [
                'window.aiChat',
                'window.openAIChat',
                'window.sendAIChatMessage',
                'jQuery',
                '$'
            ];
            
            container.innerHTML = '';
            objects.forEach(obj => {
                const exists = eval(`typeof ${obj}`) !== 'undefined';
                const li = document.createElement('li');
                li.innerHTML = `
                    <i class="fas fa-${exists ? 'check text-success' : 'times text-danger'} me-2"></i>
                    ${obj}: ${exists ? 'Available' : 'Not found'}
                `;
                container.appendChild(li);
            });
        }
        
        // API Test functions
        async function testSuggestionsAPI() {
            try {
                const response = await fetch('/api/chat/suggestions');
                const data = await response.json();
                return { success: true, data };
            } catch (error) {
                return { success: false, error: error.message };
            }
        }
        
        async function testContextAPI() {
            try {
                const response = await fetch('/api/chat/context', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-TOKEN': $('meta[name="csrf-token"]').attr('content') || 'test'
                    },
                    body: JSON.stringify({ product_id: 1 })
                });
                const data = await response.json();
                return { success: true, data };
            } catch (error) {
                return { success: false, error: error.message };
            }
        }
        
        async function testMessageAPI() {
            try {
                const response = await fetch('/api/chat/message', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-TOKEN': $('meta[name="csrf-token"]').attr('content') || 'test'
                    },
                    body: JSON.stringify({ 
                        message: 'Xin chào, đây là tin nhắn test' 
                    })
                });
                const data = await response.json();
                return { success: true, data };
            } catch (error) {
                return { success: false, error: error.message };
            }
        }
        
        // Event listeners
        document.getElementById('test-suggestions').addEventListener('click', async () => {
            const result = await testSuggestionsAPI();
            showAPIResult('Suggestions API', result);
        });
        
        document.getElementById('test-context').addEventListener('click', async () => {
            const result = await testContextAPI();
            showAPIResult('Context API', result);
        });
        
        document.getElementById('test-message').addEventListener('click', async () => {
            const result = await testMessageAPI();
            showAPIResult('Message API', result);
        });
        
        document.getElementById('open-chat').addEventListener('click', () => {
            if (typeof window.openAIChat === 'function') {
                window.openAIChat();
            } else {
                alert('Chat function không khả dụng. Kiểm tra ai-chat.js có load không.');
            }
        });
        
        document.getElementById('send-test-message').addEventListener('click', () => {
            if (typeof window.sendAIChatMessage === 'function') {
                window.sendAIChatMessage('Đây là tin nhắn test từ trang debug');
            } else {
                alert('SendMessage function không khả dụng.');
            }
        });
        
        function showAPIResult(testName, result) {
            const container = document.getElementById('api-results');
            const div = document.createElement('div');
            div.className = `alert alert-${result.success ? 'success' : 'danger'} mt-2`;
            div.innerHTML = `
                <strong>${testName}:</strong> ${result.success ? 'SUCCESS' : 'FAILED'}
                <pre class="mt-2 mb-0">${JSON.stringify(result, null, 2)}</pre>
            `;
            container.appendChild(div);
        }
        
        // Initialize
        $(document).ready(function() {
            console.log('Debug page loaded');
            checkSystemStatus();
            checkJSObjects();
            
            // Check every 2 seconds for chat widget
            setInterval(() => {
                checkJSObjects();
            }, 2000);
        });
    </script>
</body>
</html>
